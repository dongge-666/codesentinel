[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentinel"
version = "0.1.0"
description = "Evidence-driven multi-agent review gate for local Git diffs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
  { name = "CodeSentinel Contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "bandit>=1.9.4,<2",
  "detect-secrets>=1.5,<2",
  "openai>=2.46,<3",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
codesentinel = "codesentinel.runtime.cli:main"
codesentinel-deepseek-preflight = "codesentinel.preflight.deepseek:main"
codesentinel-p7-live = "codesentinel.preflight.p7_agents:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codesentinel.policies" = ["*.toml"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[[e3_qualifiers]]
source = "rule"
detector_name = "detect_dangerous_call"
detector_versions = ["1.0.0", "1.1.0"]

[[e3_qualifiers]]
source = "system"
detector_name = "policy_integrity"
detector_versions = ["1.0.0"]

[[block_rules]]
rule_id = "B001"
categories = ["secret"]
statuses = ["confirmed"]
min_severity = "high"
min_evidence_level = "E3"

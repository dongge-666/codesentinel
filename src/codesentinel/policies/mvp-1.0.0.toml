require_new_side = true

[[needs_review_rules]]
rule_id = "N001"
manual_action = "Re-run or manually complete every mandatory check."

[[needs_review_rules]]
rule_id = "N002"
manual_action = "Reduce the diff scope or provide the missing code context."

[[needs_review_rules]]
rule_id = "N003"
manual_action = "Resolve the listed evidence conflicts before merging."

[[needs_review_rules]]
rule_id = "N004"
manual_action = "Manually validate each unresolved high-severity finding."

[[needs_review_rules]]
rule_id = "N005"
manual_action = "Review the medium-risk business semantics and expected behavior."

[[needs_review_rules]]
rule_id = "N006"
manual_action = "Repair or replace the invalid or incomplete Agent artifact."

[[needs_review_rules]]
rule_id = "N007"
manual_action = "Restore the required model or tool service and re-run the missing review."

[[needs_review_rules]]
rule_id = "N008"

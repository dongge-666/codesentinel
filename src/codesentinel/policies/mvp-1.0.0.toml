schema_version = "1.0.0"
policy_version = "mvp-1.0.0"
decision_precedence = ["FAILED", "BLOCK", "NEEDS_REVIEW", "PASS"]
always_required_skills = ["detect_secret"]
provider_failure_error_codes = [
  "MODEL_AUTH_ERROR",
  "MODEL_ERROR",
  "MODEL_QUOTA_EXCEEDED",
  "RATE_LIMITED",
  "TIMEOUT",
]

[[required_artifacts]]
schema_name = "SecurityReview"
schema_version = "1.0.0"
agent_id = "security-scanner"
agent_role = "Security Scanner"

[[required_artifacts]]
schema_name = "QualityReview"
schema_version = "1.0.0"
agent_id = "quality-reviewer"
agent_role = "Quality Reviewer"

[severity_rank]
info = 0
low = 1
medium = 2
high = 3
critical = 4

[evidence_rank]
E0 = 0
E1 = 1
E2 = 2
E3 = 3

[rule_ids]
pass = "P001"
input_failure = "F001"
policy_failure = "F002"
engine_failure = "F003"
integrity_block = "B004"

[[e3_qualifiers]]
source = "rule"
detector_name = "detect_secret"
detector_versions = ["1.0.0"]

[[e3_qualifiers]]
source = "rule"
detector_name = "detect_injection"
detector_versions = ["1.0.0", "1.1.0"]

[[e3_qualifiers]]
source = "static_tool"
detector_name = "detect_injection"
